[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprover"
version = "0.1.0"
description = "Minimal file-based exploration and verification harness"
requires-python = ">=3.11"

[project.scripts]
autoprover = "autoprover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
