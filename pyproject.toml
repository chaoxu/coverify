[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprover"
version = "0.1.0"
description = "Agent harness for proof exploration over a Cosheaf knowledge base"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autoprover = "autoprover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
