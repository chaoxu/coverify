[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverify"
version = "0.1.0"
description = "Cosheaf-backed exploration tools for mathematical resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coverify = "coverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
